<script type="module">
import * as React from 'react';import * as JSX from 'react/jsx-runtime';import * as ReactDOM from 'react-dom';import {createRoot} from 'react-dom/client';
if(location.search.includes('light'))document.body.classList.add('light');
const effects=[];let plugin,registration,current={provider:'deepseek-official',model:'deepseek-v4-flash'};const subscribers=new Set();const calls=[];
function Tooltip({children,label,disabled}){const[show,setShow]=React.useState(false);return React.createElement('span',{onMouseEnter:()=>setShow(true),onMouseLeave:()=>setShow(false)},children,show&&!disabled&&ReactDOM.createPortal(React.createElement('div',{className:'tooltip'},label),document.body))}
window.__ModuleLoader__={load(entry){plugin=entry.factory(name=>({'react':React,'react/jsx-runtime':JSX,'react-dom':ReactDOM,'@deepseek-ai/dsh-client-ui-primitives':{Tooltip}}[name]))}};
const script=document.createElement('script');script.src='../client/client.js';document.head.appendChild(script);await new Promise((ok,no)=>{script.onload=ok;script.onerror=no});
const directory={load:async()=>{},store:{getSnapshot:()=>({current}),subscribe(fn){subscribers.add(fn);return()=>subscribers.delete(fn)}}};
const services={locale:{getSnapshot:()=>({active:'zh'})},slots:{inject(_n,fn){fn()},register(meta,component){registration={meta,component};return()=>{}}},modelDirectories:{directoryFor:()=>directory},'remote.balanceRing':{async get(provider){calls.push(provider);return{ok:true,value:{state:'ready',wallets:provider==='openrouter'?[{currency:'USD',total:'12.345'}]:[{currency:'CNY',total:'36.786',paid:'30.786',bonus:'6.00'}],kind:provider==='openrouter'?'key-limit':'balance',at:Date.now()}}}},remote:{$mount:async()=>()=>{}}};

const delay=ms=>new Promise(resolve=>setTimeout(resolve,ms));const lines=[];function check(condition,text){if(!condition)throw Error(text);lines.push('PASS '+text);document.getElementById('report').textContent=lines.join('\n')}
try{
await delay(800);const trigger=()=>document.querySelector('.dbc_trigger');
check(trigger()?.getAttribute('aria-label').includes('¥ 36.78'),'圆环与余额提示已挂载');

const bg=getComputedStyle(document.querySelector('.dbc_panel')).backgroundColor;check(bg===(document.body.classList.contains('light')?'rgb(255, 255, 255)':'rgb(44, 44, 46)'),'详情背景为实色，半透明菜单变量不再影响阅读');
check(document.querySelector('.dbc_panel').parentElement===document.body,'详情挂载到页面根部，避开输入框裁剪');
current={provider:'openrouter',model:'other/model'};document.getElementById('model').textContent='OpenRouter 模型 ⌄';for(const fn of subscribers)fn();await delay(200);
check(document.querySelector('.dbc_panel').textContent.includes('API Key 剩余额度')&&document.querySelector('.dbc_panel').textContent.includes('$ 12.34'),'切换供应商立即刷新并区分 API Key 额度');
document.querySelector('.dbc_refresh').click();await delay(150);check(calls.filter(x=>x==='openrouter').length>=2,'详情刷新按钮可用');

current={provider:'deepseek-official',model:'deepseek-v4-flash'};document.getElementById('model').textContent='DeepSeek-V4-Flash Max ⌄';for(const fn of subscribers)fn();await delay(150);trigger().click();await delay(150);
trigger().blur();document.title='RENDER OK';lines.push('RENDER OK · '+(document.body.classList.contains('light')?'light':'dark'));document.getElementById('report').textContent=lines.join('\n');
}catch(error){document.title='RENDER FAILED';document.getElementById('report').textContent='FAIL '+error.stack}
</script></body></html>
